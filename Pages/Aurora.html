<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Pokémon Dawn Fall</title>
    <link rel="stylesheet" href="../Css/style.css">
    <link rel="icon" href="../Img/Logos/LogoDawn-FallAurora.png" type="favicon">
</head>
<body>

    <header>
        <a href="../index.html" class="logo">
            <img src="../Img/Logos/LogoDawn-FallAurora.png" alt="Pokémon Dawn Fall Logo">
        </a>
        <h1>Pokédex - Pokémon Dawn Fall</h1>
        <input type="text" id="pesquisa" placeholder="Search Pokémon...">
        <nav>
            <a href="../index.html">Pokédex</a>
            <a href="#">Map</a>
            <a href="#">Type Chart</a>
            <a href="Pages/Aurora.html">Pokémon Dawnfall Aurora</a>
        </nav>
    </header>
    <main class="pokedex">
        <section class="pokemon-card" id="Aurora-Pinsteel">
            <div class="pokemon-header">
                <h2>Aurora Pinsteel</h2>
                <span class="pokemon-number">#019</span>
            </div>
            <picture class="pokemon-artwork">
                <img src="../Img/Pokémons/Aurora-Pinsteel.png" alt="Aurora Pinsteel Pokémon">
            </picture>
            <div class="pokemon-info">
                <span class="info-label">Type</span>
                <div class="pokemon-types">
                    <img class="types" src="../Img/Type Icons/Aurora.png" alt="Aurora">
                    <img class="types" src="../Img/Type Icons/Steel.png" alt="Steel">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
