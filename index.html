<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Pokémon Dawn Fall</title>
    <link rel="stylesheet" href="Css/style.css">
    <link rel="icon" href="Img/Logos/LogoDawn-Fall.png" type="favicon">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="Img/Logos/LogoDawn-Fall.png" alt="Pokémon Dawn Fall Logo">
        </a>
        <h1>Pokédex - Pokémon Dawn Fall</h1>
        <input type="text" id="pesquisa" placeholder="Search Pokémon...">
        <nav>
            <a href="index.html">Pokédex</a>
            <a href="#">Map</a>
            <a href="#">Type Chart</a>
            <a href="Pages/Aurora.html">Pokémon Dawnfall Aurora</a>
        </nav>
    </header>
    <main class="pokedex">
        <section class="pokemon-card" id="Panpe">
            <div class="pokemon-header">
                <h2>Panpe</h2>
                <span class="pokemon-number">#001</span>
            </div>
            <picture class="pokemon-artwork">
                <img src="Img/Pokémons/Panpe.png" alt="Panpe Pokémon">
            </picture>
            <div class="pokemon-info">
                <span class="info-label">Type</span>
                <div class="pokemon-types">
                    <img class="types" src="Img/Type Icons/Grass.png" alt="Grass">
                </div>
            </div>
        </section>
        <section class="pokemon-card" id="Picoat">
            <div class="pokemon-header">
                <h2>Picoat</h2>
                <span class="pokemon-number">#002</span>
            </div>
            <picture class="pokemon-artwork">
                <img src="Img/Pokémons/Picoat.png" alt="Picoat Pokémon">
            </picture>
            <div class="pokemon-info">
                <span class="info-label">Type</span>
                <div class="pokemon-types">
                    <img class="types" src="Img/Type Icons/Grass.png" alt="Grass">
                    <img class="types" src="Img/Type Icons/Ice.png" alt="Ice">
                </div>
            </div>
        </section>
        <section class="pokemon-card" id="Pineursa">
            <div class="pokemon-header">
                <h2>Pineursa</h2>
                <span class="pokemon-number">#003</span>
            </div>
            <picture class="pokemon-artwork">
                <img src="Img/Pokémons/Pineursa.png" alt="Pineursa Pokémon">
            </picture>
            <div class="pokemon-info">
                <span class="info-label">Type</span>
                <div class="pokemon-types">
                    <img class="types" src="Img/Type Icons/Grass.png" alt="Grass">
                    <img class="types" src="Img/Type Icons/Ice.png" alt="Ice">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
